---

services:
  nginxpm:
    container_name: nginxpm
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      DISABLE_IPV6: 'true'
      X_FRAME_OPTIONS: 'sameorigin'
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - "${SERVICES_DIR}/nginx-pm/data:/data"
      - "${SERVICES_DIR}/nginx-pm/letsencrypt:/etc/letsencrypt"
      - "${SERVICES_DIR}/nginx-pm/snippets:/snippets"
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
