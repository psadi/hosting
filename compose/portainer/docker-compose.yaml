---

services:
  portainer-ce:
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    depends_on:
      - nginxpm

volumes:
  portainer_data:
    external: true
    name: portainer_data
