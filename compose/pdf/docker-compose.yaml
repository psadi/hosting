---

services:
  stirling-pdf:
    container_name: pdf
    image: frooodle/s-pdf:latest-ultra-lite
    volumes:
      - "${SERVICES_DIR}/pdf/trainingData:/usr/share/tesseract-ocr/4.00/tessdata"
      - "${SERVICES_DIR}/pdf/extraConfigs:/configs"
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_US
    healthcheck:
      test: [ "CMD-SHELL", "curl -o /dev/null -s -w '%{http_code}' 'http://localhost:8080/api/v1/info/status'" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
